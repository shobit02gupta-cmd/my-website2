<!doctype html>
<html>
  <head>
    <style>
      .form {
        border: 2px solid black;
        padding: 20px;
        width: 300px;
        background-color: crimson;
        border-radius: 10px;
        margin: auto;
        margin-top: 200px;
      }
      .label {
        font-size: 50px;
      }
      .input {
        border-radius: 10px;
        width: 230px;
      }
      .button {
        border-radius: 10px;
        border: 2px solid black;
        background-color: green;
        color: white;
        padding: 10px;
      }
      .button:hover {
        color: black;
      }
    </style>
  </head>
  <body>
    <div class="form">
      <h1><u>LOGIN HERE:-</u></h1>
      <form action="" method="">
        <label>Name:</label><br />
        <input type="text" name="name" class="input" /><br />
        <label>Email:</label><br />
        <input type="email" name="email" class="input" /><br />
        <button class="button">submit</button>
      </form>
    </div>
  </body>
</html>
