<html lang="en">

    <title>Document</title>
    <style>
     .p-box{
      display: grid;
     }
     .w{
        border:2px solid black;
        height: 100px;
        width:100px;    
    }
    </style>
</head>
<body>
  <div class="p-box">
    <div class="w">box1</div>
    <div class="w">box2</div>
    <div class="w">box3</div>
    <div class="w">box4</div>
  </div>  
</body>
</html>
