<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      h1{
        text-align: center;
      }
      body{
        background-color: aquamarine;
      }
      p{
        text-align: center;
      }
      .form_sec{
        margin-left:700px;
      }
      .role{
        margin-left: 430px;
      }
      .whole_sec{
        background-color: antiquewhite;
      }
      .b{
        margin-left: 723px;
      }
      .a{
        margin-left:250px;
      }
      .like{
        margin-left: 530px;
      }
      .future{
        margin-left: 300px;
      }
      .c{
        margin-left: 429px;
      }
    </style>
</head>
<body>
<h1>SURVEY FORM</h1>
    <div class="whole_sec">
         <p>Let us know how we can improve freeCodeCamp</p>
         <div class="form_sec">
         <form method="" action="">
         <label>Name:</label>
         <input type="text" placeholder="Enter your name"><br><br>
         <label>Email:</label>
         <input type="text" placeholder="Enter your Email"><br><br>
         <label>Age</label>
         <input type="number" placeholder="Age">
         <select>
         <option>12</option>
         <option>13</option>
         <option>14</option>
         <option>15</option>
         <option>16</option>
         <option>17</option>
         <option>18</option>
         <option>19</option>
         <option>20</option>
         <option>21</option>
         </select>
         </form>
         </div>
         <br>
           <div class="role">
           <label>Which option best describes your current role?</label>
           <select>
              <option>student</option>
              <option>teacher</option>
              </select>
           </div>
           <br>
            <div class="recommend">
              <label class="a">How likely is that you would you recommend freeCodeCamp to a friend </label>
              <input type="radio" name="important">
              <label>Definitely</label><br>
              <input type="radio" name="important" class="b" >
              <label>Maybe</label><br>
              <input type="radio" name="important" class="b">
              <label >Not sure</label>
            </div> 
            <br>
             <div class="like">
                <label>What do you like most in FCC</label>
                <select>
                    <option>lunch</option>
                    <option>breakfast</option>
                    <option>Dinner</option>
                </select>
             </div>
             <br>
             <div class="future">
                <label>Things that should be improved in the future(check all that apply)</label>
                <input type="checkbox">
                <label>Front-end projects</label><br>
                <input type="checkbox" class="c">
                <label>Back-end projects</label><br>
                <input type="checkbox" class="c">
                <label>Data visualiztion</label>
            </div>
            <br>
</div>              
</body>
</html>
