<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .a{list-style-type: circle}
    .b{list-style-type: disc;}
    .c{list-style-type: square;}
    .d{list-style-type: upper-roman;}
    .e{list-style-type: lower-roman;}
    .f{list-style-type: lower-alpha;}
    .g{list-style-type: decimal;}
    </style>
</head>
<body>
    <ul class="a"> <!--circle-->
        <li>tea</li>
        <li>coffee</li>
        <li>milk</li>
    </ul>
    <ul class="b">
        <li>tea</li><!--disc-->
        <li>coffee</li>
        <li>milk</li>
    </ul>
    <ul class="c"> <!--square-->
    <li>tea</li>
    <li>coffee</li>
    <li>milk</li>
    </ul>
    <ol class="d"><!--upperroman-->
        <li>mango</li>
        <li>apple</li>
        <li>watermelon</li>
    </ol>
    <ol class="e"><!--loweroman-->
        <li>mango</li>
        <li>apple</li>
        <li>watermelon</li>
    </ol>
    <ol class="f"><!--loweralpha-->
        <li>mango</li>
        <li>apple</li>
        <li>watermelon</li>
    </ol>
    <ol class="g"><!--decimal-->
       <li>mango</li>
       <li>apple</li>
       <li>watermelon</li>
    </ol>
</body>
</html>
