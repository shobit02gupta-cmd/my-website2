<!doctype html>
<html>
  <head>
    <title>HTML lists</title>
  </head>
  <body>
    <h1>unordered list</h1>
    <ul>
      <li>potato</li>
      <li>onion</li>
      <li>tomato</li>
      <li>cabbage</li>
    </ul>
    <h2>ordered list</h2>
    <ol>
      <li>pineapple</li>
      <li>banana</li>
      <li>orange</li>
      <li>grape</li>
    </ol>
  </body>
</html>
